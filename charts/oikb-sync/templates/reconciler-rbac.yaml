{{- $name := include "oikb-sync.reconcilerName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "oikb-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciler
---
# Least privilege: one Secret and one Deployment, by name. The reconciler cannot
# list, read or create any other object.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "oikb-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciler
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "oikb-sync.configSecretName" . | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "oikb-sync.fullname" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "oikb-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
