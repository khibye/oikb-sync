{{- if not .Values.existingSecret }}
{{- $name := include "oikb-sync.keysSecretName" . }}
{{- $apiKey := required "openWebUI.apiKey is required (or set existingSecret to a Secret that holds it)" .Values.openWebUI.apiKey }}
{{- /* Keep a generated daemon key across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $daemonKey := .Values.daemon.apiKey }}
{{- if not $daemonKey }}
{{- $prev := dig "data" .Values.secretKeys.daemonApiKey "" ($existing | default dict) }}
{{- $daemonKey = ternary ($prev | b64dec) (randAlphaNum 48) (ne $prev "") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "oikb-sync.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secretKeys.openWebUIApiKey }}: {{ $apiKey | b64enc | quote }}
  {{ .Values.secretKeys.daemonApiKey }}: {{ $daemonKey | b64enc | quote }}
{{- end }}
