{{- /*
The daemon's .oikb.yaml. It holds per-KB credentials, so it is a Secret.

The chart creates it WITHOUT data on purpose: the reconciler owns its content.
Because the key is never part of the rendered manifest, `helm upgrade` leaves the
reconciler's data alone (Helm only removes fields it applied before), and the
credentials never end up in Helm's release history.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oikb-sync.configSecretName" . }}
  labels:
    {{- include "oikb-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
  annotations:
    oikb.openwebui.com/content-owner: {{ include "oikb-sync.reconcilerName" . }}
type: Opaque
